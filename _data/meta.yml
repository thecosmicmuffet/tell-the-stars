title: Tell the Stars
tagline: Tool to explore the development of language
motto: 'Root to branch: lineage. Branch to leaf: masoret.'
thesis: >-
  It's really about the incremental differentiation of experience to utterance as coordinates
  in language expand over time and the way that the initial ingestion of our map is always
  a 'name' because identity is experience, and the collapse of identity across communicators
  is, for some reason, fuzzily atomic.
thesis_by: thecosmicmuffet
idea:
- >-
  Language doesn't come preformed at the current level of sophistication. First people had
  to agree on gestures and utterances that they could copy and trade. Then they had to make
  a regular set of words that were shared instead of each person developing their own 'calls'.
  Finally, people started scratching in the dirt or writing on cave walls, and built the connection
  between the experiences they could name with their words and iconic representations that
  could evoke someone else's experiences in their own mind without saying anything.
- >-
  This starts with letters, and every letter becomes a junction of misunderstandings/valid
  different experiences which unfold into more letters and more rules about letters (and accent
  marks on letters). Your house my house. Bird, red bird, Big bird, big red bird. Eventually,
  incremental differentiation of experience to utterance as coordinates in language expand
  over time and the way that the initial ingestion of our map is always a 'name' because identity
  is experience, and the collapse of identity across communicators is, for some reason, fuzzily
  atomic.
- >-
  The idea is to grab hold of some of the truly primal imagery and symbolism that we know
  was present from early history, and begin exploring where the maps of symbols meet with
  the inarguable reality that allowed us to coordinate in this way in the first place.
verse: {ref: Gen.15.5, text: 'Tell the stars, if thou be able to number them: and he said
    unto him, So shall thy seed be.'}
