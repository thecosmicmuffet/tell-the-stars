cons: בנה
w: בָּנָה
def: build, build
bdb: b.cb
note: >-
  Build. The first building in scripture is the woman (Gen 2:22). 'It may be that I may obtain
  children by her' (Gen 16:2; 30:3) is literally 'I may be built through her.' Ben, son, has
  been heard in this root since antiquity, though it is probably an independent word. The
  Baptist's pun runs between them: 'God is able of these stones (avanim) to raise up children
  (banim) unto Abraham' (Matt 3:9).
