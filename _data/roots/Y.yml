cons: יה
w: יָהּ
def: Yah, the short form of the Name
bdb: e.az
element: true
note: >-
  The short form of the Name, as in hallelu-yah. 'Extol him that rideth upon the heavens by
  his name JAH' (Ps 68:4). In personal names it closes as -yah or -yahu (Mattaniah, Benaiah)
  or opens as Yeho- or Yo- (Jehohanan, Joel). Every name carrying it feeds the tree's taproot.
