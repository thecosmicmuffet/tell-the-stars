cons: אל
w: אֵל
def: El, God
bdb: a.dl
element: true
note: >-
  El, God, the oldest Semitic word for deity. It closes a name (Ishmael, Israel) or opens
  one (Eliezer, Elisheba). With Yah it is the second taproot.
