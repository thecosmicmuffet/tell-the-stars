en: Jesse
heb: יִשַׁי
xlit: yišay
gloss: there is? (uncertain)
parent: obed
kind: begat
ref: Ruth.4.17
order: 317
strong: '3448'
li: fla
note: >-
  Yishai, perhaps from yesh, there is. 'There shall come forth a rod out of the stem of Jesse,
  and a Branch (netser) shall grow out of his roots (shorashav)' (Isa 11:1); 'there shall
  be a root of Jesse, which shall stand for an ensign (nes) of the people; to it shall the
  Gentiles seek' (11:10). The root stands up as a banner, nes, the word for the pole of the
  bronze serpent (Num 21:8).
