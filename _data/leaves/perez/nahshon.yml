en: Nahshon
heb: נַחְשׁוֹן
xlit: naḥšôn
gloss: little serpent; diviner
parent: amminadab
kind: begat
ref: Ruth.4.20
order: 306
roots:
- {root: נחש, id: r-n-cu}
strong: '5177'
li: iev
note: >-
  Nahshon, from nahash: serpent, or diviner, or bronze. Prince of Judah in the wilderness
  (Num 1:7). A midrash says that at the Red Sea he walked into the water first, up to his
  nostrils, before it divided (Sotah 37a). Matthew lists him as Naasson (1:4).
