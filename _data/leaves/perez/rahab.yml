note: >-
  Rahav: broad, spacious, the root of Rehoboth, 'for now the LORD hath made room for us' (Gen
  26:22). A Canaanite of Jericho. The cord she hung in her window is tiqvah, 'this line of
  scarlet thread' (Josh 2:18), and tiqvah is also the word for hope. Matthew names her among
  Jesus' mothers (1:5).
