note: >-
  David, beloved (dod). 'There remaineth yet the youngest (ha-qatan)' (1 Sam 16:11): the small
  one. In Hebrew letters David counts 4+6+4 = 14, and Matthew counts the genealogy in fourteens:
  'all the generations from Abraham to David are fourteen generations' (1:17). Chronicles
  makes him Jesse's seventh son (1 Chr 2:15); Samuel implies an eighth (1 Sam 16:10-11).
