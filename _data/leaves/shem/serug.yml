note: >-
  Serug is a vine tendril. Sarigim are the three branches of the butler's dream: 'it was as
  though it budded, and her blossoms shot forth; and the clusters thereof brought forth ripe
  grapes,' and he 'pressed them into Pharaoh's cup' (Gen 40:10-11).
