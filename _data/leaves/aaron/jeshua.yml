note: >-
  Yeshua, Yah saves: the name of Joshua and of Jesus. Zechariah saw him 'standing before the
  angel of the LORD, and Satan standing at his right hand to resist him' (Zech 3:1). Joshua
  said nothing in his own defence; the answer came from the LORD: 'The LORD rebuke thee, O
  Satan' (3:2). His filthy garments were taken away, and later he was crowned and told, 'Behold
  the man whose name is The BRANCH; and he shall grow up out of his place' (6:12). His sons
  head the roll in Ezra 10:18.
