note: >-
  Yokheved, Yah is glory: 'the daughter of Levi' (Num 26:59), mother of Aaron, Moses and Miriam.
  Hers is the earliest personal name in scripture built on the divine Name, carried before
  her son hears the Name at the bush (Exod 3:14-15; 6:3).
