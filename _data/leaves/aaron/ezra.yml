note: >-
  Ezra, help: the word in 'an help (ezer) meet for him' (Gen 2:18). 'The son of Seraiah' (Ezra
  7:1), but Seraiah died in 586 BC and Ezra came to Jerusalem in the seventh year of Artaxerxes,
  probably 458: 'son' means descendant. Ezra 7:1-5 also skips six names that 1 Chronicles
  6 keeps.
