note: >-
  Nadav, freewill: the root of nedavah, the freewill offering. Nadab and Abihu 'offered strange
  (zarah) fire before the LORD, which he commanded them not' (Lev 10:1). The root returns
  in Amminadab, Abinadab and Machnadebai.
