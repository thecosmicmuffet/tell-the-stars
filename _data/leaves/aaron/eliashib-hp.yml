en: Eliashib
heb: אֶלְיָשִׁיב
xlit: ʾelyāšîb
gloss: God restores
parent: joiakim
kind: begat
ref: Neh.12.10
order: 300
roots:
- {root: שוב, id: r-v-bn}
- {root: אל, id: E}
strong: '475'
li: atf
note: >-
  Elyashiv, God brings back. Nehemiah names an Eliashib the priest who 'prepared for (Tobiah
  the Ammonite) a great chamber' in the courts of the house of God (Neh 13:4-7); readers differ
  on whether he is this high priest.
