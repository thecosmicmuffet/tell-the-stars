en: Phinehas
heb: פִּינְחָס
xlit: pînĕḥās
gloss: 'Egyptian: the Nubian, the dark one'
parent: eleazar
kind: begat
ref: Exod.6.25
order: 271
links:
- {to: putiel, kind: mother's father}
strong: '6372'
li: kec
note: >-
  Pinhas is Egyptian: pa-nehsy, the Nubian, the dark one. He is the zealot of Numbers 25,
  who killed an Israelite man and a Midianite woman and was given 'my covenant of peace' (25:12).
  Ezra's genealogy runs through him (Ezra 7:5).
