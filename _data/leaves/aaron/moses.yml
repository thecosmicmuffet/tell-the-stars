note: >-
  Pharaoh's daughter 'called his name Moses: and she said, Because I drew him (meshitihu)
  out of the water' (Exod 2:10). An Egyptian princess names him, and in Egyptian ms means
  born, child, son: Thut-mose, Ah-mose, Ra-mose, the son of a god. Moses is that name with
  the god left off. Read as Hebrew, Mosheh is an active participle: not 'drawn out' but 'one
  who draws out.'
