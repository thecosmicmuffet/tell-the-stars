note: >-
  Half Egyptian. The rabbis read the name two ways at once: Jethro, who fattened (pittem)
  calves for idols, and Joseph, who mastered (pitpet) his desire (Sotah 43a; Bava Batra 109b).
  The Talmud says the tribes taunted Phinehas with this grandfather after the killing at Peor
  (Sanhedrin 82b).
