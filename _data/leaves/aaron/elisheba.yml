note: >-
  Elisheva, my God is an oath, or God of seven (sheva). 'Daughter of Amminadab, sister of
  Naashon' (Exod 6:23): the priests' mother is from Judah's line. Luke names Zacharias's wife
  after her: 'of the daughters of Aaron, and her name was Elisabeth' (Luke 1:5).
