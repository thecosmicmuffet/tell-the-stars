en: Serah
heb: שֶׂרַח
xlit: śeraḥ
gloss: abundance? (uncertain)
parent: asher
kind: son
ref: Gen.46.17
order: 231
flags: f
strong: '8294'
li: njo
note: >-
  Serah, abundance: a daughter of Asher, counted among the seventy and again in the census
  (Num 26:46). Later tradition keeps her alive for centuries: she tells Jacob that Joseph
  lives (Sefer haYashar), and shows Moses where Joseph's bones lie (Sotah 13a).
