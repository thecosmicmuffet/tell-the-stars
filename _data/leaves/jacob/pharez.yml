note: >-
  'How hast thou broken forth? this breach (perets) be upon thee' (Gen 38:29). The twin who
  came out ahead of the scarlet thread. David's line is headed 'the generations of Pharez'
  (Ruth 4:18), in the formula Genesis uses for its own sections.
