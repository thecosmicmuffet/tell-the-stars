note: >-
  Yetser, form or frame: the potter's verb of 'the LORD God formed (yatsar) man of the dust'
  (Gen 2:7), and the yetser of 'every imagination (yetser) of the thoughts of his heart' (6:5).
  Naphtali's son is named Imagination.
