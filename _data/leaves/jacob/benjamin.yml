note: >-
  Dying, Rachel 'called his name Benoni: but his father called him Benjamin' (Gen 35:18).
  Oni can be read 'my sorrow' or 'my strength' (49:3, 'the beginning of my strength (oni)').
  Benjamin, son of the right hand. Both Sauls come from this tribe: the king, and the apostle
  who wrote 'of the tribe of Benjamin' (Phil 3:5).
