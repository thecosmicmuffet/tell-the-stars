note: >-
  'Happy am I, for the daughters will call me blessed (ishsheruni)' (Gen 30:13). This is the
  blessing word of Psalm 1:1, 'Blessed (ashrei) is the man,' whose tree is planted by the
  palgei mayim, the channels of Peleg.
