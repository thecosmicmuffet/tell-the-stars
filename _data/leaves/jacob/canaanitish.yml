en: the Canaanitish woman
heb: הַכְּנַעֲנִית
xlit: hakkĕnaʿănît
gloss: unnamed; known by her people
parent: canaan
kind: people
ref: Gen.46.10
order: 199
flags: fu
note: >-
  'Shaul the son of a Canaanitish woman' (Gen 46:10; Exod 6:15). She is counted among the
  seventy who went down to Egypt only as her son's mother. The King James '-ish' is the old
  suffix 'of that people,' as in English and Danish, not the 'somewhat' that modern ears hear
  in it. The Hebrew is ha-kena'anit, the Canaanitess.
