note: >-
  'Daughter of Shua,' a Canaanite (Gen 38:2; 1 Chr 2:3, 'Bathshua the Canaanitess'). Judah's
  wife; mother of Er, Onan and Shelah. Chronicles later gives the same name to Bathsheba (1
  Chr 3:5).
