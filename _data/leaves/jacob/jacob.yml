note: >-
  'His hand took hold on Esau's heel; and his name was called Jacob' (Gen 25:26): heel-holder,
  or as a name, may God protect. Esau hears the supplanter (27:36). At the Jabbok: 'Thy name
  shall be called no more Jacob, but Israel: for as a prince hast thou power with God and
  with men' (32:28). When Jacob asks the wrestler's name, he is blessed instead (32:29). Jeremiah:
  'The heart is deceitful (aqov) above all things' (Jer 17:9), two verses after the blessed
  tree.
