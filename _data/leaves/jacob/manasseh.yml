note: >-
  'For God, said he, hath made me forget (nashani) all my toil, and all my father's house'
  (Gen 41:51). Son of Asenath the Egyptian. Jacob adopts him (48:5) and sets him in the blessing:
  'In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh' (48:20).
