note: >-
  'They called his name Esau' because he came out 'all over like an hairy garment' (Gen 25:25);
  he is called Edom, red, after the red pottage he sold his birthright for (25:30). Edom is
  Adam's root. His wives are listed twice under different names (26:34; 28:9; 36:2-3).
