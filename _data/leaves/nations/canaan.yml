en: Canaan
heb: כְנָעַן
xlit: kĕnaʿan
gloss: lowland, bowed low; merchant; purple-land?
parent: ham
kind: begat
ref: Gen.10.6
order: 46
flags: n
roots:
- {root: כנע, id: r-k-cd}
strong: 3667a
li: fuv
note: >-
  Cursed for his father's act (Gen 9:25), in the same breath as the God of Shem is blessed.
  The root kana' means to bend low, be humbled, and Canaan has been read as 'lowland.' Kena'ani
  became the ordinary word for a merchant: the virtuous woman 'delivereth girdles unto the
  merchant' (Prov 31:24), and Hosea's 'He is a merchant, the balances of deceit are in his
  hand' (Hos 12:7) reads 'Canaan.' An older theory links the name to Akkadian kinahhu, red-purple
  wool, which would make Canaan 'purple-land,' like Greek Phoenicia; that link is now doubted.
  Matthew calls the woman who argued with Jesus about the crumbs 'a woman of Canaan' (15:22),
  the only person the Greek New Testament calls a Canaanite; Mark calls her 'a Syrophenician'
  (7:26).
