note: >-
  'For in his days was the earth divided (niflegah)' (Gen 10:25). Peleg is division, and a
  water-channel cut for irrigation. Psalm 1's tree is 'planted by the rivers of water,' palgei
  mayim, channels of water, under 'Blessed (ashrei) is the man.'
