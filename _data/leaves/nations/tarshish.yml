en: Tarshish
heb: תַרְשִׁישׁ
xlit: taršîš
gloss: the far-west port; a jewel
parent: javan
kind: begat
ref: Gen.10.4
order: 40
flags: n
strong: '8659'
li: nye
note: >-
  The far-west harbor. Jonah 'found a ship going to Tarshish: so he paid the fare thereof'
  (Jonah 1:3). Tarshish is also a stone in the high priest's breastplate, the King James 'beryl'
  (Exod 28:20).
