note: >-
  Abram, exalted father; then Abraham, 'for a father of many nations (av hamon goyim) have
  I made thee' (Gen 17:5). The new name adds one letter, he, and the explanation hears hamon,
  multitude. The father of the many nations is the patriarch of the Ezra 10 houses and of
  the peoples they sent away.
