en: Hagar
heb: הָגָר
xlit: hāgār
gloss: 'flight? (folk: the stranger)'
parent: mizraim
kind: people
ref: Gen.16.1
order: 125
flags: f
naming:
- {ref: Gen.16.13, text: 'And she called the name of the LORD that spake unto her, Thou God
    seest me: for she said, Have I also here looked after him that seeth me?'}
strong: '1904'
li: cyk
note: >-
  The one person in scripture who names God: 'she called the name of the LORD that spake unto
  her, Thou God seest me' (Gen 16:13), El-roi. Her well is Beer-lahai-roi, the well of the
  Living One who sees me, and later Isaac 'dwelt by the well Lahairoi' (25:11): the heir settles
  at the excluded woman's well. Her own name is often heard as ha-ger, the stranger, though
  the derivation is uncertain.
