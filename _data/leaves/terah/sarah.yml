note: >-
  Sarai, my princess, becomes Sarah, princess (Gen 17:15). Abraham calls her 'the daughter
  of my father, but not the daughter of my mother' (20:12). 'It may be that I may obtain children
  by her' (16:2) is literally 'I may be built through her,' through Hagar.
