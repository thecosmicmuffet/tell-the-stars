note: >-
  'Male and female created he them; and blessed them, and called their name Adam' (Gen 5:2):
  blessed and named in one breath. Adam is from adamah, the ground he was taken from, and
  adom, red; Edom and odem, the sardius that heads the high priest's breastplate (Exod 28:17),
  share the root. Dam, blood, sits inside the word, and adamah is Adam with a he added: 'for
  dust thou art' (Gen 3:19).
