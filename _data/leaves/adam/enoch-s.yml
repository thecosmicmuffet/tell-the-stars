note: >-
  Hanokh, dedicated or initiated, as a house is dedicated (hanukkah). Cain's Enoch has a city
  named after him (Gen 4:17); Seth's Enoch 'walked with God: and he was not; for God took
  him' (5:24). The same name, read once as a foundation and once as a disappearance.
