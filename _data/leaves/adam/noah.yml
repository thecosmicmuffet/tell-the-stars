note: >-
  'This same shall comfort us (yenahamenu) concerning our work and toil of our hands, because
  of the ground which the LORD hath cursed' (Gen 5:29). The name is noah, rest; the explanation
  reaches for naham, comfort. The Septuagint reads 'shall give us rest.' Out of the water,
  Noah 'began to be an husbandman, and he planted a vineyard' (9:20), the first vine in scripture.
