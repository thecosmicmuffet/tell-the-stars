note: >-
  Eve names him: 'For God, said she, hath appointed (shat) me another seed instead of Abel'
  (Gen 4:25). Seth is the son set into a gap. 'Adam... begat a son in his own likeness, after
  his image' (5:3), the words God used for making Adam (1:26).
