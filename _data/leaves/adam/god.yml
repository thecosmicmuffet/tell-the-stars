en: of God
greek: τοῦ θεοῦ
gloss: the root register, unlabeled
ref: Luke.3.38
order: 1
flags: g
note: >-
  Luke's genealogy ends 'which was the son of Adam, which was the son of God' (Luke 3:38),
  but the Greek says 'son' only once, at the start (3:23). After that it is the article alone,
  seventy-odd times: of Heli, of Matthat, of Adam, of God. The King James supplies 'which
  was the son' all the way up, in italics. Adam is of God the way a word is of its root.
