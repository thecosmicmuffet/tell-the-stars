note: >-
  Kenan is Cain with a suffix. The lines of Genesis 4 and 5 are one skeleton read twice: Cain
  and Kenan, Enoch and Enoch, Irad and Jared, Mehujael and Mahalaleel, Methusael and Methuselah,
  Lamech and Lamech. Luke 3:36, following the Septuagint, adds a second Cainan between Arphaxad
  and Sala that the Hebrew does not have.
