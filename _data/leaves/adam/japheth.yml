note: >-
  'God shall enlarge (yaft) Japheth, and he shall dwell in the tents of Shem' (Gen 9:27).
  The rabbis heard yafeh, beauty, and took the verse as permission to write the Torah in Greek,
  Japheth's language: let the beauty of Japheth dwell in the tents of Shem (Megillah 9b).
  Translation licensed by a pun on a name.
