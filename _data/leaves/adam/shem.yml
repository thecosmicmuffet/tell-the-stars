note: >-
  Shem means name. After the vineyard, Noah's waking words contain the first time scripture
  blesses the LORD: 'Blessed be the LORD God of Shem; and Canaan shall be his servant' (Gen
  9:26). The blessing of the God of Name and the curse of Canaan come out of one mouth in
  one breath.
