note: >-
  Named twice. First Ishah, 'because she was taken out of Man' (Gen 2:23); then Havvah, 'because
  she was the mother of all living' (3:20). The verb for her making is vayyiven, 'and he built'
  (2:22): the first building in scripture is a woman, from the root of Bani, Binnui and Benaiah
  on Ezra's roll. A saying of Rabbi Akiva (Sotah 17a) is read this way: ish and ishah share
  esh, fire; his yod and her he together spell Yah.
