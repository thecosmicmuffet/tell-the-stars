note: >-
  The kin wanted to name him after his father. 'His mother answered and said, Not so; but
  he shall be called John. And they said unto her, There is none of thy kindred that is called
  by this name' (Luke 1:60-61). His father wrote 'His name is John,' and his mouth was opened
  (1:63-64): a name that breaks with the line, given by both parents.
