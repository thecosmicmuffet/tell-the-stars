note: >-
  'Saul, (who also is called Paul,)' (Acts 13:9). Luke never says he was renamed; the narrative
  switches names in Cyprus, in the presence of a proconsul called Sergius Paulus. Paulus is
  Latin for small, and Paul calls himself 'the least (elachistos) of the apostles' (1 Cor
  15:9). The first Saul of Benjamin was told 'When thou wast little in thine own sight' (1
  Sam 15:17); the second took Small for his name.
