note: >-
  'Simon the Canaanite' in the King James (Matt 10:4) has nothing to do with Canaan. The Greek
  is Kananaios, from Aramaic qan'ana, zealot; Luke translates it, 'Simon called Zelotes' (6:15).
  The root is qana, jealous: 'the LORD, whose name is Jealous' (Exod 34:14).
