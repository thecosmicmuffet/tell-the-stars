note: >-
  'A seller of purple, of the city of Thyatira, which worshipped God... whose heart the Lord
  opened' (Acts 16:14). She is named for her people, the Lydians, and she trades in purple:
  the two senses once read in Canaan's name. Then she houses the apostles: 'come into my house,
  and abide there. And she constrained us' (16:15).
