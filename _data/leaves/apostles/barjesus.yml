note: >-
  'A certain sorcerer, a false prophet, a Jew, whose name was Barjesus' (Acts 13:6): son of
  Jeshua. In English bar also means except, or a beam across a road, and he stood across the
  way, 'seeking to turn away the deputy from the faith' (13:8). Paul named him again: 'thou
  child of the devil' (13:10), son of the diabolos, from diaballein, to throw across; the
  opposite of a symbolon, thrown together. His sentence was Saul's own: 'thou shalt be blind,
  not seeing the sun for a season,' and he went 'seeking some to lead him by the hand' (13:11),
  the word Luke used for Saul led into Damascus (9:8).
