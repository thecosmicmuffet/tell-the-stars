en: Jona
heb: יוֹנָה
xlit: yônâ
greek: Ἰωνᾶς
gloss: dove
parent: israel
kind: of
ref: Matt.16.17
order: 518
note: >-
  'Blessed art thou, Simon Bar-jona' (Matt 16:17); bar is Aramaic for son. John's gospel calls
  him 'Simon the son of Jona' in later manuscripts and 'Simon son of John' in the oldest (John
  1:42; 21:15): the father's name has two readings.
