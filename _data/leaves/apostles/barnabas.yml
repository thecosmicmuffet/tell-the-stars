note: >-
  'Joses, who by the apostles was surnamed Barnabas, (which is, being interpreted, The son
  of consolation,)' (Acts 4:36). The Aramaic behind it is disputed: bar nevu'ah, son of prophecy,
  and Adolf Deissmann's Bar-Nebo, son of Nebo, a name found in Semitic inscriptions, have
  both been proposed. If the second, the last house on Ezra's roll survives in the name of
  the Levite who vouched for Saul (Acts 9:27).
