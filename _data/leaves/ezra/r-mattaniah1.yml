note: >-
  Mattanyah, gift of Yah: four men on the roll. The last king of Judah was a Mattaniah renamed
  by Nebuchadnezzar (2 Kgs 24:17). Count the n-t-n names (Nethaneel, Mattaniah, Mattenai,
  Mattathah, Nathan, Mattithiah) with the z-b-d names (Zebadiah, Jozabad, Zabad): sixteen
  of the 113 are named gift or given.
