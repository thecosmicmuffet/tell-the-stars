note: >-
  Shekhanyah, Yah has dwelt: the root of Shekhinah. He proposed the covenant: 'We have trespassed
  against our God, and have taken strange wives... yet now there is hope (mikveh) in Israel
  concerning this thing' (Ezra 10:2). Mikveh is hope, and a gathering of water: 'the gathering
  together of the waters (mikveh ha-mayim) called he Seas' (Gen 1:10), and later the ritual
  pool. 'O LORD, the hope (mikveh) of Israel... the fountain of living waters' (Jer 17:13).
  Rabbi Akiva: as the pool makes the unclean clean, so the Holy One cleanses Israel (Mishnah
  Yoma 8:9).
