en: Tikvah
heb: תִּקְוָה
xlit: tiqwâ
gloss: hope; cord
parent: israel
kind: house
ref: Ezra.10.15
order: 388
roots:
- {root: קוה, id: r-s-aq}
strong: '8616'
li: nwt
note: >-
  Tiqvah: hope, and a cord. Rahab's 'line of scarlet thread' is tiqvat hut ha-shani (Josh
  2:18). Shechaniah's word for hope was mikveh, a pool; the son of this Hope stood against
  the covenant, or over it.
