en: Elijah
heb: אֵלִיָּה
xlit: ʾēlîyâ
gloss: my God is Yah
parent: harim-p
kind: house
ref: Ezra.10.21
order: 400
roots:
- {root: אל, id: E}
- {root: יה, id: Y}
strong: '452'
li: ash
note: >-
  Eliyyah, my God is Yah: the short spelling Kings uses four times for the prophet (2 Kgs
  1:3, 4, 8, 12) and Malachi uses for his return: 'Behold, I will send you Elijah the prophet...
  And he shall turn the heart of the fathers to the children, and the heart of the children
  to their fathers' (Mal 4:5-6). At the cross the crowd heard Eli, my God, and said 'This
  man calleth for Elias' (Matt 27:46-47). Letter for letter, Eliyyah and adamah, the ground,
  share the first and last: alef and he.
