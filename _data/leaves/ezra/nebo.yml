note: >-
  Nebo is Nabu, the Babylonian god of writing and of scribes ('Nebo stoopeth,' Isa 46:1),
  and Mount Nebo is where Moses died looking into the land (Deut 34:1). The roll of Ezra the
  scribe ends with the house of the scribes' god, and its last name is Benaiah, Yah has built.
  Barnabas's name may preserve Nebo too.
