note: >-
  'Ezra... went into the chamber of Johanan the son of Eliashib: and when he came thither,
  he did eat no bread, nor drink water' (Ezra 10:6). If this is the high priest of Nehemiah
  12:22-23, 'son' here means grandson, and the date of Ezra's mission moves with it.
