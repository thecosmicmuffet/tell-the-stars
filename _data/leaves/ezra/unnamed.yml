note: >-
  'All these had taken strange wives: and some of them had wives by whom they had children'
  (Ezra 10:44). The Hebrew of the last clause is broken; it ends 'and they set sons.' The
  written text has nasa'ei, the Masoretic reading nas'u, 'they took.' 1 Esdras 9:36 finishes
  the sentence: 'and they put them away with their children.' No wife or child is named. Ezra
  9:1 lists their peoples: Canaanites, Hittites, Perizzites, Jebusites, Ammonites, Moabites,
  Egyptians, Amorites. All but the Perizzites already hang somewhere on this tree.
