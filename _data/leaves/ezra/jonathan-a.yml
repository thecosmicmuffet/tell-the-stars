note: >-
  'Only Jonathan the son of Asahel and Jahaziah the son of Tikvah were employed about this
  matter' (Ezra 10:15, KJV). The Hebrew, amdu al zot, can mean 'stood over this' or 'stood
  against this'; most modern versions read opposition.
