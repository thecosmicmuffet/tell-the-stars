en: Jarib
heb: יָרִיב
xlit: yārîb
gloss: he contends, pleads
parent: jeshua
kind: house
ref: Ezra.10.18
order: 395
roots:
- {root: ריב, id: r-t-cm}
strong: '3402'
li: fje
note: >-
  Yariv, he contends, he pleads a case: Joiarib with the Name left off (Ezra 8:16 has both
  forms). The first priestly lot fell to Jehoiarib (1 Chr 24:7). Hosea files the Jabbok under
  this root: 'The LORD hath also a controversy (riv) with Judah, and will punish Jacob' (Hos
  12:2).
