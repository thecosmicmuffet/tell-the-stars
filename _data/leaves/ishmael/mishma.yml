note: >-
  Mishma, Dumah, Massa (Gen 25:14): hearing, silence, burden. Isaiah's oracle 'The burden
  (massa) of Dumah' is the watchman's night: 'Watchman, what of the night?... The morning
  cometh, and also the night: if ye will enquire, enquire ye: return, come' (Isa 21:11-12).
