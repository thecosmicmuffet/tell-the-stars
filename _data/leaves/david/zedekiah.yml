note: >-
  'The king of Babylon made Mattaniah his father's brother king in his stead, and changed
  his name to Zedekiah' (2 Kgs 24:17). The last king of Judah was a Mattaniah, gift of Yah.
  His sons were killed before his eyes, and then his eyes were put out (25:7). Mattaniah appears
  four times on Ezra's roll.
