note: >-
  Bat-sheva: daughter of the oath, or daughter of seven. 'The daughter of Eliam, the wife
  of Uriah the Hittite' (2 Sam 11:3). Chronicles calls her Bath-shua (1 Chr 3:5), the name
  of Judah's Canaanite wife. Matthew names her only by her Hittite husband: 'her that had
  been the wife of Urias' (1:6).
