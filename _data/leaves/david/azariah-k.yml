note: >-
  Kings calls him Azariah, Yah has helped (2 Kgs 15:1); Kings and Chronicles also call him
  Uzziah, Yah is my strength (2 Kgs 15:13; 2 Chr 26:1). Help and strength, ezer and oz, differ
  by one letter. Isaiah saw the Lord 'in the year that king Uzziah died' (Isa 6:1).
