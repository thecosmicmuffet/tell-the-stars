note: >-
  'I have gotten (qaniti) a man from the LORD' (Gen 4:1). Qayin is a smith, or a spear (2
  Sam 21:16); the naming hears qanah, to acquire. His line has no toledot heading, and 'the
  book of the generations of Adam' (5:1) passes over him.
