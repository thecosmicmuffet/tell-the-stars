note: >-
  'The father of all such as handle the harp and organ' (Gen 4:21). Yuval is a stream; yovel
  is the ram's horn, and the jubilee it announces. 'Blessed is the man that trusteth in the
  LORD... For he shall be as a tree planted by the waters, and that spreadeth out her roots
  by the river (yuval)' (Jer 17:7-8).
