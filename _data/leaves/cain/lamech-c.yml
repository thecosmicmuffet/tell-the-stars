en: Lamech
heb: לָמֶךְ
xlit: lemek
gloss: strong youth? (uncertain)
parent: methusael
kind: begat
ref: Gen.4.18
order: 9
strong: '3929'
li: ggf
note: >-
  His song to his wives (Gen 4:23-24) sets Cain's vengeance at sevenfold and his own at 'seventy
  and sevenfold.' When Peter asks how often to forgive, Jesus answers 'seventy times seven'
  (Matt 18:22), and the Greek is the Septuagint's phrase for Lamech's number.
