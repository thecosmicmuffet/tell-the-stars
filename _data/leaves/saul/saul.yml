note: >-
  Sha'ul, asked for: the people asked for a king. 'From his shoulders and upward he was higher
  than any of the people' (1 Sam 9:2). When the lot fell to him, 'he hath hid himself among
  the stuff' (10:22): ha-kelim, the vessels. Samuel's charge: 'When thou wast little in thine
  own sight, wast thou not made the head of the tribes of Israel?' (15:17). The second Saul
  of Benjamin was called 'a chosen vessel' (Acts 9:15) and went by Paulus, small.
