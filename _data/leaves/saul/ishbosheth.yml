note: >-
  Chronicles has Esh-baal, man of Baal (1 Chr 8:33); Samuel has Ish-bosheth, man of shame
  (2 Sam 2:8). The scribes put bosheth, shame, where the god's name stood. Baal also means
  simply lord, or husband.
