target: r:r-j-at
text: >-
  One verb, two motions of the arm. Brown-Driver-Briggs gives ידה as throw, cast:
  Qal, 'shoot at her' with arrows (Jer 50:14, yedu); Piel, 'cast a stone upon me'
  (Lam 3:53, vayyaddu). Its Hiphil is give thanks, praise, confess: 'Now will I
  praise (odeh) the LORD: therefore she called his name Judah' (Gen 29:35), and
  todah, thanksgiving, grows from the same stem. Zechariah sends the smiths 'to cast
  out (leyaddot) the horns' that scattered Judah (Zech 1:21; Hebrew 2:4), so the
  verb in Judah's name is thrown back at what scattered Judah. Jacob's blessing sets the root
  beside the hand itself: 'Judah, thou art he whom thy brethren shall praise
  (yoduka): thy hand (yadka) shall be in the neck of thine enemies' (Gen 49:8).
  Whether ידה grew from יד, hand, is not settled by this lexicon, which says only
  throw, cast; the nearness in Gen 49:8 is sound and placement, not proof of
  descent. Read side by side, these verses keep one motion that can carry a stone
  or a thanksgiving.
by: claude
