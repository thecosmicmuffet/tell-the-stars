target: p:barnabas
text: >-
  Acts 4:36 records a naming received from others: Joses is surnamed Barnabas,
  interpreted there as "The son of consolation." Acts 9:26-27 sets two
  observations beside that name: the disciples in Jerusalem fear Saul and do
  not believe he is a disciple; Barnabas takes Saul and brings him to the
  apostles, recounting what happened on the road. The text does not tell us
  that the name caused this reception, or that fear was groundless. It leaves
  an encounter in which fear and an act of introduction coexist. A received
  name does not settle who its bearer must become; here is a point where
  a name and a voluntary approach can be read beside one another.
