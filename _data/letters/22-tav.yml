note: >-
  The mark: 'set a mark (תָּו) upon the foreheads of the men that sigh and that cry' (Ezek
  9:4), and in the old script the mark was a cross. The last letter. Alef and tav together
  spell את, the word Hebrew sets before a definite object, twice in the first verse of Genesis;
  readers have taken it as the whole alphabet, first to last.
