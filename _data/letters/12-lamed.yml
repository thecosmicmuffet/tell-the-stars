char: ל
position: 12
value: 30
name: lamed
name_heb: לָמֶד
picture: a goad, or a shepherd's staff
meaning: goad
sefer_yetzirah: simple
greek: Λ lambda
latin: L
note: >-
  The only letter that rises above the line. Its name shares a root with learning: lamad is
  to learn, a talmid is a student, and a malmad is an ox goad, the weapon Shamgar used (Judg
  3:31). The goad that drives the ox, alef, follows it in El, and scribes sometimes fused
  the two into one sign (ﭏ).
