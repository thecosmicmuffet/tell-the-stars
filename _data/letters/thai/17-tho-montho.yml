char: ฑ
position: 17
name: tho montho
name_native: ฑ มณโฑ
meaning: Montho, a queen in the Ramakien
class: low
sound: th or d
ipa: tʰ or d
final_sound: t
sanskrit: ड ḍa
note: >-
  Sanskrit ḍa. Thai says it th in most words and d in a few, such as บัณฑิต, bandit, a learned person,
  from paṇḍita. Its name-word is a person: Montho, Mandodari, the queen of Ravana in the Ramakien.
