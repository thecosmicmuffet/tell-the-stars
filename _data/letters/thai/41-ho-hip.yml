char: ห
position: 41
name: ho hip
name_native: ห หีบ
meaning: chest
class: high
sound: h
ipa: h
sanskrit: ह ha
note: >-
  Besides h, a silent ห can lead a low-class nasal or sonorant (ง ญ น ม ย ร ล ว) and give it high-class
  tones, so the letter works as a tone mark: หมา, ma, dog, is spelled with it.
