char: ษ
position: 39
name: so ruesi
name_native: ษ ฤๅษี
meaning: hermit
class: high
sound: s
ipa: s
final_sound: t
sanskrit: ष ṣa
note: >-
  Sanskrit ṣa, the retroflex s, named for the ฤๅษี, ruesi, the hermit-sage, Sanskrit ṛṣi. Thai writes
  its own word for a letter with it: อักษร, akson, from akṣara.
