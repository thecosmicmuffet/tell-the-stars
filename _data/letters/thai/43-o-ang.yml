char: อ
position: 43
name: o ang
name_native: อ อ่าง
meaning: basin
class: mid
ipa: ʔ
sanskrit: अ a, as a vowel carrier
note: >-
  A consonant with no sound of its own. Thai writes every vowel around a consonant, so a syllable
  that begins with a vowel begins with อ, a catch in the throat, as alef holds the vowel in Hebrew:
  อักษร, akson, letter.
