- {char: ฅ, note: a notch at the top is the whole difference}
note: >-
  Sanskrit ga. In loanwords ค stands where Sanskrit has g, as in ครุฑ, khrut, from garuḍa. Thai lost
  the voicing, and the letter's low class keeps its memory in the tone.
