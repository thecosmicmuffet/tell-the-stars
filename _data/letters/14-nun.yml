note: >-
  Psalm 145 is an acrostic with one line missing: there is no verse for nun. The Talmud says
  David left it out because Amos's lament begins with it, 'The virgin of Israel is fallen
  (נָפְלָה)' (Amos 5:2), and that the samekh line after it catches what fell: 'The LORD upholdeth
  all that fall' (Ps 145:14; Berakhot 4b). Two inverted nuns bracket Numbers 10:35-36 in the
  Hebrew text.
