note: >-
  One letter that once held two sounds, ḥ and ḫ, as ayin held ʿ and ġ. The Greek translators
  still heard the difference in some names: Rachel comes into Greek with a chi, Isaac without
  one. Greek let the rasp go and made the letter the vowel eta; the Latin alphabet kept the
  breath as H.
