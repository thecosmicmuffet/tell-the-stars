name: qof
name_heb: קוֹף
picture: 'uncertain: the eye of a needle? the back of a head?'
meaning: uncertain; qof is also an ape
sefer_yetzirah: simple
greek: Ϙ koppa
latin: Q
near:
- {char: ה, note: he with its leg dropped below the line}
note: >-
  Greek kept koppa only as a numeral; the Latin alphabet kept it as Q. A qof is also an ape,
  as in the 'apes, and peacocks' of Solomon's ships (1 Kgs 10:22). Careful writers make it
  out of he, dropping he's leg below the line, so that the Name is not written: אלקים for
  אלהים.
