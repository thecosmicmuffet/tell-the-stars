char: ג
position: 3
value: 3
name: gimel
name_heb: גִּימֶל
picture: a throwstick? (the name means camel)
meaning: camel
sefer_yetzirah: double · g
greek: Γ gamma
latin: C, G
note: >-
  The Etruscans had no g, so the Latin alphabet used gimel's descendant, C, for k. When Rome
  wanted its g back, a stroke was added to C to make G, traditionally credited to Spurius
  Carvilius Ruga around 230 BCE: one letter became two.
