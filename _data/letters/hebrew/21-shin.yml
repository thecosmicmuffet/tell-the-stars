note: >-
  One letter, two sounds, told apart only by where a dot sits: shin and sin. At the fords
  of the Jordan the Gileadites made every man say Shibboleth, 'and he said Sibboleth: for
  he could not frame to pronounce it right' (Judg 12:6). Identity collapsed on a single sound.
  Sefer Yetzirah makes shin fire, one of the three mothers.
