note: >-
  The peg: 'the hooks of the pillars' (Exod 27:10) are their vavim. As a word it is 'and',
  the hook that joins each clause of Genesis to the next. In the West one letter unfolded
  into five: through Greek digamma it became F, and through upsilon it became V, which split
  into U, doubled into W, and came back from Greek as Y.
