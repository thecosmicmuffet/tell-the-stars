note: >-
  The prop. Its name is the verb to lean on, to support, to lay hands on: Moses 'laid his
  hands upon' Joshua (Num 27:23). In Psalm 145 the samekh line holds up the missing nun: 'The
  LORD upholdeth (סוֹמֵךְ) all that fall' (145:14).
