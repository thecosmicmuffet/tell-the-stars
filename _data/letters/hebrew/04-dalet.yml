note: >-
  The door. The Phoenician dalet was a triangle, and the Greeks named the triangle of land
  at the mouth of the Nile after the letter: the delta. In the square script dalet and resh
  differ by one corner, and the text keeps the stumbles. A dalet is a he with its foot taken
  away.
