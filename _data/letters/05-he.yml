note: >-
  The breath letter. God adds it to Abram and Sarai, and they become Abraham and Sarah (Gen
  17:5, 15). It closes adamah, the ground, and Adam is the ground without it. It closes Yah,
  and the Name holds it twice. The oldest sign is a person with arms raised.
