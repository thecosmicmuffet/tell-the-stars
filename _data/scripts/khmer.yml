note: >-
  The oldest dated inscription in Khmer, from Angkor Borei, is from 611. The script kept the Indic
  order and writes Khmer, Sanskrit and Pali; it stacks a consonant beneath another with a sign called
  coeng, foot. The Khmer word for a letter, អក្សរ, âksâr, is Sanskrit akṣara. A cursive form of the
  old Khmer letters became the Thai and Lao scripts.
