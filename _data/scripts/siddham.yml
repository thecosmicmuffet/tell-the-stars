note: >-
  Siddham means accomplished, perfected. Buddhist monks carried it with Sanskrit mantras and seed
  syllables to China, and Kūkai brought it to Japan in 806, where Shingon and Tendai still write it,
  calling the letters bonji, Sanskrit letters. A single seed syllable can stand for a deity. In India
  it gave way to Nagari by the 11th century.
