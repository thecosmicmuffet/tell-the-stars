sample: {text: 名, says: 'míng, name: a mouth under the evening'}
note: >-
  The oldest large body of Chinese writing is the Shang kings' divination, cut into bones and turtle
  shells from about 1250 BCE, and the script has been in use ever since, the longest continuous writing
  system. The Shuowen Jiezi, a dictionary of about 100 CE, explains 名, name, as a mouth, 口, under
  the evening, 夕: in the dark people cannot see one another, so they say their names.
