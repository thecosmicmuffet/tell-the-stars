sample: {text: नाम, says: 'nāma, name'}
note: >-
  The script most Sanskrit is printed in today, and the script of Hindi, Marathi and Nepali. The letters
  hang from a headline, and the alphabet is ordered by the mouth: vowels first, then the consonants
  from the throat to the lips, each row going unvoiced, aspirated, voiced, voiced aspirated, nasal
  (k kh g gh ṅ). Sanskrit has been written in many scripts, Brahmi, Siddham, Grantha, Bengali, Khmer
  and Thai among them; Devanagari is the most common. Nāma, name, is the same Indo-European word as
  Greek onoma, Latin nomen and English name; Hebrew shem is unrelated.
