note: >-
  The Arameans took the Phoenician letters, and Aramaic became the clerks' language of the Assyrian
  and then the Persian empire, from Egypt to the edge of India. Its script travelled with the clerks:
  the square Hebrew letters, Syriac, Nabataean and through it Arabic, and Kharosthi all descend from
  it, and Brahmi may. By the Talmud's account the Torah was given in the old Hebrew script and given
  again in Ezra's day in Ashurit, the 'Assyrian' script (Sanhedrin 21b). Parts of Ezra and Daniel
  are written in Aramaic.
