note: >-
  Twenty-two letters, all consonants, written right to left: the alphabet in the shape that travelled.
  The sarcophagus of Ahiram, king of Byblos, carries one of its oldest long inscriptions. Phoenician
  traders carried the letters across the Mediterranean, and Hebrew and Aramaic kept them in their
  own hands. Almost every alphabet in use today descends from it: Latin, Greek, Cyrillic, Hebrew and
  Arabic, and the scripts of India and Southeast Asia too, if Brahmi's Aramaic model is right.
