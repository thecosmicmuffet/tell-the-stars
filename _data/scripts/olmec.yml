note: >-
  The Cascajal block: a serpentine slab, 36 by 21 by 13 centimetres, found by road builders in the
  late 1990s and published in Science in 2006, with 62 signs, some repeated, one of them like an insect.
  It is dated only by the pottery found with it, to the San Lorenzo phase that ended about 900 BCE,
  and some doubt it is genuine. If it is writing, it is the oldest known in the Americas; no one can
  read it. A cylinder seal from San Andrés, about 650 BCE, carries signs that may read 3 Ajaw, a day
  or a king's name (Pohl, Pope and von Nagy, Science, 2002).
open:
- Is the Cascajal block writing, and is it genuine? What evidence would settle either question?
- Set its 62 signs beside Olmec carving and beside the Isthmian signs.
