note: >-
  An alphabet of thirty letters pressed into clay as wedges and read left to right like cuneiform.
  Its letter lists come in the order of the Phoenician and Hebrew alphabet, and also in the order
  of the South Arabian one, so the idea came from the alphabets of the Levant and the strokes from
  Mesopotamia. It wrote three alefs, one for each vowel that followed. Found at Ras Shamra in 1928
  and deciphered within two years, it went silent when Ugarit fell, around 1190 BCE. Its poems of
  Baal and El are among the closest texts to the Hebrew Bible in language.
