name: Clay tokens
kind: counters
status: partly read
year: -8000
when: from c. 8000 BCE
place: the Near East, from the Levant to Iran
note: >-
  Small shapes of clay, cones, spheres, discs and cylinders, found at Near Eastern sites from about
  8000 BCE. Denise Schmandt-Besserat read them as counters, each shape standing for a kind of goods.
  In the fourth millennium BCE accountants sealed tokens inside clay envelopes and pressed them into
  the outside, and she argued that these impressions, once drawn on tablets, became the first signs
  of cuneiform: a thing, then the print of a thing, then a sign. Her account is widely taught and
  still debated.
open:
- Which early cuneiform signs keep the shape of a token, and which were drawn from life?
