note: >-
  The Ram Khamhaeng inscription, dated 1292, says the king devised the Thai letters in 1283; whether
  the stone is what it claims has been argued since 1987, and an inscription from Phrae may be older.
  The letters came from a cursive Old Khmer. Forty-four consonant letters write twenty-one consonant
  sounds, because Thai kept letters for Sanskrit and Pali sounds it does not make: ศ ษ ส were three
  s-sounds in Sanskrit and are one s in Thai, and Thai still spells its word for a letter, อักษร,
  akson, from Sanskrit akṣara, with ษ. When Old Thai lost the voicing of its voiced consonants, the
  difference moved into tone, and the letters stayed: a consonant's class now tells the reader which
  tone to use, together with four tone marks written above.
open:
- 'Add the Thai vowels and the four tone marks: how each vowel is written around its consonant, and
  how class, vowel length and the final sound decide the tone.'
- 'Lao, Thai''s sibling, kept fewer of the Sanskrit letters: which did it let go, and when?'
