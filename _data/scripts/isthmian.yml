note: >-
  Also called Epi-Olmec. The script of La Mojarra Stela 1, whose Long Count date falls in 156 CE,
  and of the Tuxtla Statuette; the oldest piece, a sherd from Chiapa de Corzo, is put at 450–300 BCE.
  In 1993 John Justeson and Terrence Kaufman proposed a partial reading in a Zoquean language; in
  2004 Stephen Houston and Michael Coe tried it on another text, a mask of unknown origin, and could
  not make it work. The case remains open.
