place: Jiahu, a Neolithic village in Henan, China
note: >-
  Signs cut into tortoise shells and bone at Jiahu; on close study only eleven are clearly incised.
  The excavators saw likenesses to later Chinese characters, among them 目, eye, and 日, sun. Their
  2003 report in Antiquity calls the signs not writing but part of a long history of sign use that
  led to it, and most scholars doubt they are writing.
