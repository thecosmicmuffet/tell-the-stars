year: -2800
when: c. 2800–1900 BCE
place: the Indus valley, in today’s Pakistan and northwest India
dir: rtl
note: >-
  About five thousand inscriptions, mostly on small seals, averaging about five signs, drawn from
  some four hundred distinct signs and read mostly right to left. A seal often shows one animal, most
  often a one-horned bull, above the signs. More than a hundred decipherments have been proposed and
  none accepted. Steve Farmer, Richard Sproat and Michael Witzel argued in 2004 that the signs do
  not write a language at all; Rajesh Rao and colleagues answered in 2009 that their statistics look
  like language.
open:
- Is it language? What test would persuade both sides?
