note: >-
  Paleo-Hebrew: the letters of the kingdoms of Israel and Judah, in the Siloam tunnel inscription,
  on the seals and ostraca of royal officials, and earlier on the Gezer calendar. After the exile
  Jews wrote in the Aramaic hand that became the square script, but some Dead Sea scrolls kept the
  old letters for the Name alone, and the Samaritans still write with their descendant. On the page,
  the Old Hebrew labels set the Hebrew consonants in these letters.
