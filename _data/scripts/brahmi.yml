note: >-
  The script of Ashoka's edicts, cut into rock and pillars around 250 BCE, and the ancestor of nearly
  all the scripts of South and Southeast Asia, from Devanagari and Tamil to Tibetan, Thai and Javanese.
  Each letter is a consonant with a built in; other vowels are marks added to it, and the unit of
  consonant and vowel is an akṣara, a word that also means imperishable. Most scholars see a Semitic
  model, probably Aramaic, behind it, at least for the idea; some hold it was made in India; a descent
  from the Indus script is not accepted by epigraphers. James Prinsep read it in the 1830s.
