name: Pallava
kind: abugida
status: read
parent: brahmi
year: 350
when: from the 4th century CE
place: southern India, under the Pallava kings, and across the sea
dir: ltr
note: >-
  The southern Brahmi of the Pallava court, carried by priests, monks, scholars and traders across
  the Bay of Bengal. From it came the scripts of Southeast Asia: Mon and Burmese, Khmer, Cham, and
  Kawi, the parent of Javanese and Balinese; in India it became Grantha. Some epigraphers prefer to
  call it Late Southern Brahmi.
