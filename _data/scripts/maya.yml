note: >-
  The best understood of the Mesoamerican scripts. Its oldest known text, ten painted signs at San
  Bartolo in Guatemala from about 300 to 200 BCE, includes AJAW, lord (Saturno, Stuart and Beltrán,
  Science, 2006). The signs mix whole words with syllables, so a scribe could spell one word several
  ways. The reading opened in the twentieth century with Yuri Knorozov's syllables (1952) and Tatiana
  Proskouriakoff's histories of kings (1960).
