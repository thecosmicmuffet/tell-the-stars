name: Vinča symbols
kind: symbols
status: unread
year: -4500
when: mostly 4500–4000 BCE
place: 'the Danube basin: Serbia, Romania, Hungary and Bulgaria'
note: >-
  Marks on pots, figurines and other clay objects of the Vinča culture, most made between 4500 and
  4000 BCE. The Tărtăria tablets, found in Romania in 1961, may be as old as 5300 BCE, but how they
  were found and dated is disputed. Marija Gimbutas called the signs an Old European script; most
  scholars take them for symbols that did not write a language.
