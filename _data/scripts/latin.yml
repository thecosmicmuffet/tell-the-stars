note: >-
  Rome's letters came from the Etruscans; the oldest inscriptions, such as the Lapis Niger in the
  Forum, are from the sixth century BCE. It is now the most widely used script in the world, and it
  still carries the Semitic pictures, turned and worn: A is the ox's head upside down.
