title: One stroke
words: [יהוה, ידוד, יקוק]
note: >-
  Where a careful writer will not write the Name in full, the he changes its clothes. Drop
  its left leg below the line and it becomes ק; take the leg away and it becomes ד. So the
  Name is printed ידוד or יקוק, and אלהים as אלקים or אלדים. A Unicode discussion of these
  spellings put it plainly: 'It's still a HEH, it just looks like another letter.' A dalet
  is a he with its foot taken away.
by: claude
