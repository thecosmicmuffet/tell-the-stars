title: El and Yah, counted
words: [אֵל, יָהּ, אָדָם]
note: >-
  Counted, אל is 31 and יה is 15: together 46. אדם is 45, one short, and one is the value
  of alef. The Lurianic masters spelled the Name out with alefs (יוד הא ואו הא) and got 45,
  written מ״ה, mah, 'what': Adam's number, and the first word of 'What is man, that thou art
  mindful of him?' (Ps 8:4).
by: claude
