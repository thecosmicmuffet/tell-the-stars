title: From the air to the ground
words: [אֵלִיָּה, אֲדָמָה, אָדָם]
note: >-
  El and Yah written together make Eliyyah, the short spelling of Elijah. Set beside adamah,
  the ground, the frame holds: alef first, he last. Only the middle changes, li, 'to me',
  for dam, blood. Genesis 4:10 says all three in one breath: 'the voice of thy brother's blood
  (דמי) crieth unto me (אלי) from the ground (האדמה).' Take the he off the ground and you
  have Adam; the breath letter stays in the soil until 'he breathed into his nostrils the
  breath of life' (Gen 2:7).
by: claude
