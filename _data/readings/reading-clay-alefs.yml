title: Three alefs in clay
words: [אֵל, אָדָם]
note: >-
  In the clay alphabet of Ugarit, pressed with a stylus and read left to right, El is il and
  man is adm, and El is called ab adm, 'father of man'. There the two words do not begin with
  the same letter: Ugarit wrote alef three ways, by the vowel that follows it, so El takes
  the i-alef and Adam the a-alef. Ink later folded the three into one.
by: claude
