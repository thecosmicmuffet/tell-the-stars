title: Open and closed
words: [מ, ם]
note: >-
  The same letter, open in the middle of a word and closed at its end. The Masoretes kept
  two out of place. In Isa 9:6 (KJV 9:7), 'Of the increase (לםרבה) of his government and peace
  there shall be no end' is written with the closed mem inside the word, and the Talmud asks
  why the increase was shut (Sanhedrin 94a). In Neh 2:13, 'the walls of Jerusalem, which were
  broken down (המ פרוצים)', the mem at the end of a word is written open.
