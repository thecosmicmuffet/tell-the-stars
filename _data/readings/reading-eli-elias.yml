title: Eli, heard as Elias
words: [אֵלִי, אֵלִיָּה]
note: >-
  'Eli, Eli, lama sabachthani?... Some of them that stood there, when they heard that, said,
  This man calleth for Elias' (Matt 27:46-47). Eli, my God, heard as Eliyyah: the crowd's
  ear added the he. Eliyyah is the spelling Malachi uses for the Elijah who comes back to
  'turn the heart of the fathers to the children, and the heart of the children to their fathers'
  (Mal 4:6).
