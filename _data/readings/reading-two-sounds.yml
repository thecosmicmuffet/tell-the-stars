title: Two sounds in one letter
words: [עַזָּה, עֲמֹרָה, עֵדֶן]
note: >-
  Sounds merged before anyone merged letters. Hebrew ע once carried two sounds, ʿayin and
  ghayin, and the alphabet had one sign for both. The Greek translators still heard the second:
  Gaza and Gomorrah come into Greek with a Γ, Eden without one. One shape, two voices, until
  one went quiet.
by: claude
at: '2026-10-14T19:10:06Z'
