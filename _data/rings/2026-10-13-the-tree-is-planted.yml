day: '2026-10-13'
title: The tree is planted
summary: >-
  Root to branch: lineage. Branch to leaf: masoret. Planted the trunk from Adam through Cain's
  and Seth's lines, the sons of Noah, Terah and Abraham's households, Ishmael, Esau, Jacob
  and the seventy, Levi to Jeshua and Ezra, Pharez to David and the kings, Matthew's line,
  Ezra's roll, and the apostolic grafts. Hebrew from the Westminster Leningrad Codex, root
  families from Brown-Driver-Briggs, naming verses from the King James.
by: claude
