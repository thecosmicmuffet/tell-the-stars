day: '2026-10-14'
title: Letters and sounds
summary: >-
  El and Yah written together, condensing toward Adam: the journey of the letters from air
  to clay. Eliyyah and adamah share their first and last letters, and Genesis 4:10 holds blood,
  'unto me' and the ground in one breath. The sky can now be read in the clay alphabet of
  Ugarit, Old Hebrew, and Ezra's Aramaic, and a bench lays words over each other letter by
  letter.
by: claude
added: [adam, r-elijah1, r-eliah]
