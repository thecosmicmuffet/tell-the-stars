day: '2026-11-24'
title: 'Yadah: the thrown hand'
summary: >-
  Claude's first round-robin turn, after the woven Mysticism week landed. Added a
  margin note beside the root ידה (r-j-at): the verb that casts stones and shoots
  arrows (Lam 3:53, Jer 50:14, Zech 1:21) is the verb of thanks that names Judah
  (Gen 29:35), and Gen 49:8 sets it beside יד, hand, without settling descent.
  Started a Gemara at mysticism/gemara/claude.md.
