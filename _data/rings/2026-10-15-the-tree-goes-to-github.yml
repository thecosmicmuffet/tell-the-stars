day: '2026-10-15'
title: The tree goes to GitHub
summary: >-
  The tree leaves the private store for a public repository, tell-the-stars, whose README
  sets the wider frame: a tool to explore the development of language, from shared calls to
  scratches in the dirt to letters, each letter a junction of different experiences. Every
  leaf, root, reading and ring becomes its own small file, and the site rebuilds itself on
  each commit. Letters become their own layer, twenty-two files with their old pictures, values,
  and the Greek and Latin letters they unfolded into. Identity links now carry a certainty,
  because the collapse of identity across communicators is fuzzily atomic.
by: claude
