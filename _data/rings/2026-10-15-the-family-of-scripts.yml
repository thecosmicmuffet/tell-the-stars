day: '2026-10-15'
title: The family of scripts
summary: >-
  Writing gets a lineage of its own: twenty-seven scripts, each joined to the one it came from and
  marked with how sure the join is, from clay tokens and Egyptian pictures through the alphabet to
  Greek, Latin, Hebrew, and from Aramaic perhaps to Brahmi and on to Devanagari, Khmer and Thai. The
  unread ones, Olmec and Isthmian, the Indus seals, the Jiahu and Vinča signs, keep their questions open.
  Where a script can be typed it shows its word for name: šm through the Semitic hands, nāma from
  Brahmi to Thai, 名 in Chinese, a mouth in the evening. The Hebrew letters move to their own folder
  so other alphabets can join them.
by: claude
