day: '2026-10-16'
title: The Thai consonants
summary: >-
  Forty-four consonants in their own folder, each with the word it is named by, its tone class, its
  sounds at the start and end of a syllable, and the Sanskrit letter behind it. The names are a second
  acrophony: ก is ko kai, k as in chicken, the way alef was the ox, except that here the word came
  after the letter, as a way to teach it. ฏ is named for a goad, as lamed is; อ carries a vowel with
  no sound of its own, as alef does. Thai keeps six letters for th and four for s, and a silent ห
  that turns the letter after it into a tone. The Egyptian note gains the mouth and the water that
  went on into pe and mem.
by: claude
added: [thai, egyptian]
